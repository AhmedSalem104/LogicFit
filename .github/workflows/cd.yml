name: CD - Production (manual)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Git SHA or release tag to deploy'
        required: true
        type: string
      confirm:
        description: 'Type DEPLOY-PRODUCTION to confirm a production deployment'
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    if: ${{ inputs.confirm == 'DEPLOY-PRODUCTION' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_tag }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 8.*
      - run: dotnet restore LogicFit.sln
      - run: dotnet build LogicFit.sln -c Release --no-restore
      - run: dotnet test LogicFit.sln -c Release --no-build --verbosity normal
      - run: dotnet ef migrations script --idempotent --no-build --configuration Release --project LogicFit.Infrastructure --startup-project LogicFit.API --output /tmp/logicfit-migrations.sql

  deploy:
    if: ${{ inputs.confirm == 'DEPLOY-PRODUCTION' }}
    needs: preflight
    runs-on: windows-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_tag }}

      - name: Require WebDeploy profile
        shell: pwsh
        env:
          PLATFORM_PROFILE_B64: ${{ secrets.RUNASP_PLATFORM_PUBLISH_SETTINGS_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PLATFORM_PROFILE_B64)) {
            throw "RUNASP_PLATFORM_PUBLISH_SETTINGS_B64 is required."
          }

      - name: Build publish outputs
        shell: pwsh
        run: |
          # Platform controllers are hosted by LogicFit.API (Unified API).
          # LogicFit.Platform.API is now a class library and must not be deployed
          # as a standalone IIS application.
          dotnet publish LogicFit.API/LogicFit.API.csproj -c Release -o "$env:RUNNER_TEMP/unified-publish" /p:UseAppHost=false

      - name: Decode protected publish profiles
        shell: pwsh
        env:
          PLATFORM_PROFILE_B64: ${{ secrets.RUNASP_PLATFORM_PUBLISH_SETTINGS_B64 }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/platform.publishSettings", [Convert]::FromBase64String($env:PLATFORM_PROFILE_B64))

      - name: Deploy Unified API with WebDeploy
        shell: pwsh
        run: .\Scripts\deploy-webdeploy.ps1 -PublishSettingsPath "$env:RUNNER_TEMP/platform.publishSettings" -ContentPath "$env:RUNNER_TEMP/unified-publish"

      - name: Verify production health
        shell: pwsh
        env:
          PLATFORM_HEALTH_URL: ${{ secrets.RUNASP_PLATFORM_HEALTHCHECK_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PLATFORM_HEALTH_URL)) {
            throw "RUNASP_PLATFORM_HEALTHCHECK_URL is required."
          }
          $response = Invoke-WebRequest -Uri $env:PLATFORM_HEALTH_URL -UseBasicParsing -TimeoutSec 30
          if ($response.StatusCode -ne 200) { throw "Health check failed for $env:PLATFORM_HEALTH_URL" }
