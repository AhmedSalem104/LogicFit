name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: LogicFit_Test_Only_2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'LogicFit_Test_Only_2026!' -C -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore LogicFit.sln

      - name: Build
        run: dotnet build LogicFit.sln -c Release --no-restore

      - name: Test
        run: dotnet test LogicFit.sln -c Release --no-build --verbosity normal
        env:
          LOGICFIT_TEST_CONNECTION_STRING: "Server=localhost,1433;Database=master;User Id=sa;Password=LogicFit_Test_Only_2026!;Encrypt=False;TrustServerCertificate=True;MultipleActiveResultSets=True"

      - name: Install EF CLI
        run: dotnet tool install --global dotnet-ef --version 8.*

      - name: Validate EF migrations
        run: dotnet ef migrations script --idempotent --configuration Release --project LogicFit.Infrastructure --startup-project LogicFit.API --output /tmp/logicfit-migrations.sql

  docker:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build unified API image
        run: docker build -f LogicFit.API/Dockerfile -t logicfit-api:ci .
