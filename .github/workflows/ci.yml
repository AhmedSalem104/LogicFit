name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: LogicFit_Test_Only_2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'LogicFit_Test_Only_2026!' -C -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore LogicFit.sln

      - name: Build
        run: dotnet build LogicFit.sln -c Release --no-restore

      - name: Test
        run: dotnet test LogicFit.sln -c Release --no-build --verbosity normal
        env:
          LOGICFIT_TEST_CONNECTION_STRING: "Server=localhost,1433;Database=master;User Id=sa;Password=LogicFit_Test_Only_2026!;Encrypt=False;TrustServerCertificate=True;MultipleActiveResultSets=True"

      - name: Install EF CLI
        run: dotnet tool install --global dotnet-ef --version 8.*

      - name: Validate EF migrations
        # The shared context remains the compatibility context until #174/#175/#166 cut over
        # resolver/provisioning. The isolated contexts have their own migration assemblies and
        # are validated by DbContextOwnershipTests in the same job.
        run: dotnet ef migrations script --idempotent --configuration Release --project LogicFit.Infrastructure --startup-project LogicFit.API --context LogicFit.Infrastructure.Persistence.ApplicationDbContext --output /tmp/logicfit-migrations.sql

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore LogicFit.sln

      - name: Assert tracked secret policy
        shell: pwsh
        run: ./Scripts/Assert-NoTrackedSecrets.ps1

      - name: Block high and critical NuGet vulnerabilities
        shell: pwsh
        run: |
          $report = (dotnet list LogicFit.sln package --vulnerable --include-transitive --format json | Out-String) | ConvertFrom-Json
          $blocking = [System.Collections.Generic.List[string]]::new()
          foreach ($project in @($report.projects)) {
            foreach ($framework in @($project.frameworks)) {
              foreach ($package in @($framework.topLevelPackages) + @($framework.transitivePackages)) {
                foreach ($vulnerability in @($package.vulnerabilities)) {
                  $severity = [string]$vulnerability.severity
                  if ($severity -in @('High', 'Critical')) {
                    $blocking.Add("$($package.id) $($package.resolvedVersion) $severity")
                  }
                }
              }
            }
          }
          if ($blocking.Count -gt 0) {
            throw "High or critical NuGet vulnerabilities remain: $($blocking -join '; ')"
          }
          Write-Host 'NuGet vulnerability gate passed.'

  docker:
    runs-on: ubuntu-latest
    needs: [verify, security]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build unified API image
        run: docker build -f LogicFit.API/Dockerfile -t logicfit-api:ci .
